name: Fotos do app
# Baixa as fotos de etiquetas registradas no app LocalPrice para estudio/assets/fotos-app/.
# Dispara: manualmente, toda quarta às 9h (Belém) e quando estudio/pedidos/fotos-app.txt muda.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 3"
  push:
    branches: [gh-pages]
    paths: ["estudio/pedidos/fotos-app.txt"]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Buscar fotos
        env:
          SUPABASE_URL: https://uxocshuyrpfyqqauvlfv.supabase.co
          # chave pública (publishable) do app, a mesma que o site usa no navegador
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4b2NzaHV5cnBmeXFxYXV2bGZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMzIzMDksImV4cCI6MjA4NTgwODMwOX0.0U1xwt__7XSCxc17ojU67wGmVInCtPKzPgShqZh2EoM
        run: python3 estudio/ferramentas/buscar_fotos_app.py
      - name: Salvar no repositório
        run: |
          git config user.name "localprice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add estudio/assets/fotos-app
          git diff --cached --quiet || git commit -m "Fotos do app: atualização automática"
          git push
